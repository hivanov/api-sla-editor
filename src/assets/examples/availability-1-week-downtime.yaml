sla: 1.0.0
context:
  id: "availability-1-week-downtime"
  type: "plans"
metrics:
  up:
    type: number
    description: "Service status"
  uptime:
    type: number
    unit: percent
    description: "Service Uptime percentage"
plans:
  enterprise:
    availability:
      metric: uptime
      target: "98.08%"
      expression: "up == 1"