sla: 1.0.0
context:
  id: azure-sample
  type: plans
metrics:
  uptime:
    type: number
    unit: percent
    description: "Service Uptime percentage"
    monitoringId: "availability"
    resourceType: Microsoft.Compute/virtualMachines
  cpu_utilization:
    type: number
    unit: percentage
    description: CPU utilization of the VM
    monitoringId: "percentage_cpu"
    resourceType: Microsoft.Compute/virtualMachines
  memory_utilization:
    type: number
    unit: percentage
    description: Memory utilization of the VM
    monitoringId: "available_memory_bytes"
    resourceType: Microsoft.Compute/virtualMachines
plans:
  gold:
    title: Gold Plan
    availability:
      metric: uptime
      target: "99.9%"
      expression: "uptime > 0.999"
    guarantees:
      - metric: cpu_utilization
        operator: <
        value: "80"
        period: PT5M
      - metric: memory_utilization
        operator: <
        value: "90"
        period: PT5M
    x-support-policy:
      contactPoints:
        - contactType: Support Team
          channels:
            - type: email
              url: mailto://support@example.com
              description: Primary support email
