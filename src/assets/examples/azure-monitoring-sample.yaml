sla: 1.0.0
context:
  id: azure-sample
  type: plans
metrics:
  cpu_utilization:
    type: number
    unit: percentage
    description: CPU utilization of the VM
    monitoringId: Percentage CPU
    resourceType: Microsoft.Compute/virtualMachines
  memory_utilization:
    type: number
    unit: percentage
    description: Memory utilization of the VM
    monitoringId: Available Memory Bytes
    resourceType: Microsoft.Compute/virtualMachines
plans:
  gold:
    title: Gold Plan
    availability: 99.9%
    guarantees:
      - metric: cpu_utilization
        operator: <
        value: "80"
        period: PT5M
    x-support-policy:
      contactPoints:
        - contactType: Support Team
          channels:
            - type: email
              url: mailto://support@example.com
              description: Primary support email
