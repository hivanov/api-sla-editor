sla: 1.0.0
context:
  id: "metrics-100-concurrent-connections"
  type: "plans"
metrics:
  uptime:
    type: number
    unit: percent
    description: "Service Uptime"
  concurrent_connections:
    type: "integer"
    unit: "items"
    description: "Number of concurrent connections for all APIs."
plans:
  enterprise:
    availability:
      metric: uptime
      target: "99.9%"
      expression: "uptime > 0.999"
    quotas:
      concurrent_connections:
        max: 100
