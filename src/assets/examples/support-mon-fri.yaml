sla: 1.0.0
context:
  id: "support-mon-fri"
  type: "plans"
metrics:
  uptime:
    type: number
    unit: percent
    description: "Service Uptime"
plans:
  enterprise:
    availability:
      metric: uptime
      target: "99.9%"
      expression: "up == 1"
    x-support-policy:
      hoursAvailable:
        - dayOfWeek: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
          opens: "09:00"
          closes: "17:00"
          timezone: "Europe/Berlin"