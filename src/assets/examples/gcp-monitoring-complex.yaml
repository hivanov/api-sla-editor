sla: 1.0.0
context:
  id: gcp-infrastructure-services
  type: plans
metrics:
  uptime:
    type: number
    unit: percent
    description: "Service Uptime percentage"
    monitoringId: "custom.googleapis.com/api/uptime"
    resourceType: "global"
    metricKind: "GAUGE"
  cpu_utilization:
    type: number
    unit: percent
    description: "Average CPU utilization across the cluster"
    monitoringId: "compute.googleapis.com/instance/cpu/utilization"
    resourceType: "gce_instance"
    metricKind: "GAUGE"
  request_latency:
    type: number
    unit: ms
    description: "Ninetieth percentile response time for API requests"
    monitoringId: "custom.googleapis.com/api/request_latency"
    resourceType: "global"
    metricKind: "GAUGE"
  error_rate:
    type: number
    unit: percent
    description: "Rate of 5xx responses"
    monitoringId: "custom.googleapis.com/api/error_rate"
    resourceType: "global"
    metricKind: "GAUGE"
plans:
  Gold:
    title: "Mission Critical Support"
    description: "Tier 1 support for production environments with strict guarantees"
    availability:
      metric: uptime
      target: "99.99%"
      expression: "avg_over_time(uptime[1m]) > 0.9999"
    pricing:
      cost: 5000
      currency: USD
      period: P30D
    guarantees:
      - measurement: "avg_over_time(cpu_utilization[5m]) < 80"
    serviceLevelObjectives:
      - name: "Latency Performance"
        priority: "High"
        guarantees:
          - measurement: "avg_over_time(request_latency[1m]) < 200"
    x-support-policy:
      contactPoints:
        - contactType: "SRE On-Call"
          channels:
            - type: email
              url: "mailto://sre-alerts@example.com"
              description: "Primary pager channel"
            - type: phone
              url: "tel://+15550123456"
              description: "Emergency voice bridge"
      hoursAvailable:
        - dayOfWeek: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
          opens: "00:00"
          closes: "23:59"
          timezone: "UTC"
      serviceLevelObjectives:
        - name: "Incident Response"
          priority: "P0"
          guarantees:
            - measurement: "avg_over_time(error_rate[1m]) < 0.1"
  Silver:
    title: "Standard Production"
    description: "Recommended for standard production workloads"
    availability:
      metric: uptime
      target: "99.9%"
      expression: "avg_over_time(uptime[1m]) > 0.999"
    pricing:
      cost: 1500
      currency: USD
      period: P30D
    guarantees:
      - measurement: "avg_over_time(cpu_utilization[15m]) < 90"
    serviceLevelObjectives:
      - name: "Latency Performance"
        priority: "Medium"
        guarantees:
          - measurement: "avg_over_time(request_latency[5m]) < 500"
    x-support-policy:
      contactPoints:
        - contactType: "DevOps Support"
          channels:
            - type: email
              url: "mailto://support@example.com"
      hoursAvailable:
        - dayOfWeek: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
          opens: "09:00"
          closes: "17:00"
          timezone: "Europe/Berlin"